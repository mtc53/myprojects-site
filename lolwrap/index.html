<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>League Vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><rect x='14' y='14' width='4' height='4' fill='%23fafafa'/></svg>">
<style>
  :root{
    --bg:#0a0a0a;
    --line:#1f1f1f;
    --text:#fafafa;
    --muted:#a3a3a3;
    --faint:#6b6b6b;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:15px;-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column}

  .bar{display:flex;align-items:center;gap:18px;padding:11px 20px;
       border-bottom:1px solid var(--line);flex:none}
  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
        font-family:var(--mono);font-size:11px;color:var(--faint);
        transition:color .18s ease}
  .back:hover,.back:focus-visible{color:var(--text);outline:none}
  .back svg{width:11px;height:11px}
  .here{font-family:var(--mono);font-size:11px;color:var(--faint);
        letter-spacing:.08em;text-transform:uppercase}

  iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}

  .empty{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .empty div{max-width:420px}
  .empty h1{font-size:17px;font-weight:500;letter-spacing:-.015em;margin:0 0 10px}
  .empty p{color:var(--muted);font-size:14px;margin:0;line-height:1.55}
  .empty code{font-family:var(--mono);font-size:12.5px;color:var(--text)}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="bar">
    <a class="back" href="https://myprojects.cc/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
           ><path d="M19 12H5M12 19l-7-7 7-7"/></svg>myprojects</a>
    <span class="here">League Vault</span>
  </div>

  <iframe id="frame" title="League Vault dashboard" hidden></iframe>

  <div class="empty" id="empty" hidden>
    <div>
      <h1>Nothing published yet</h1>
      <p>In League Vault on the Mac, open <code>Settings &rsaquo; Your server</code>
        and publish into this folder. The dashboard appears here as soon as it
        lands.</p>
    </div>
  </div>

<script>
  (function () {
    var frame = document.getElementById("frame");
    var empty = document.getElementById("empty");
    fetch("vault/", { method: "HEAD" })
      .then(function (r) {
        if (r.ok) { frame.src = "vault/"; frame.hidden = false; }
        else { empty.hidden = false; }
      })
      .catch(function () { empty.hidden = false; });
  })();
</script>
</body>
</html>
