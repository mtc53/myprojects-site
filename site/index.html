<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>myprojects</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><rect x='14' y='14' width='4' height='4' fill='%23fafafa'/></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <div class="bar"><p class="mark in">myprojects.cc</p></div>

    <nav class="rows">
      <a class="row in" style="animation-delay:.06s" href="league/">
        <span class="name">League Vault</span>
        <span class="meta"><span class="sub" data-sub></span><span class="dot" data-dot></span></span>
      </a>
      <a class="row in" style="animation-delay:.12s" href="warroom/">
        <span class="name">Kingdom War Room</span>
        <span class="meta"><span class="sub" data-sub></span><span class="dot" data-dot></span></span>
      </a>
      <a class="row in" style="animation-delay:.18s" href="osrs/">
        <span class="name">OSRS Bot</span>
        <span class="meta"><span class="sub" data-sub></span><span class="dot" data-dot></span></span>
      </a>
    </nav>

    <footer class="in" style="animation-delay:.24s">
      <span>no password — read-only, auto-published</span>
    </footer>
  </main>

<script>
// Light up each row with its project's live status + a one-word summary.
const DAY = 864e5;
const slugs = ["league", "warroom", "osrs"];
function statusOf(d){
  const t = Date.parse(d.updated);
  const old = !Number.isNaN(t) && Date.now()-t > DAY;
  if (d.status === "offline") return "offline";
  return old ? "stale" : (d.status || "ok");
}
function ago(iso){
  const t = Date.parse(iso); if (Number.isNaN(t)) return "";
  const s = Math.max(0, Date.now()-t)/1000;
  if (s<3600) return Math.round(s/60)+"m"; if (s<86400) return Math.round(s/3600)+"h";
  return Math.round(s/86400)+"d";
}
document.querySelectorAll("a.row").forEach((row, i) => {
  const dot = row.querySelector("[data-dot]");
  const sub = row.querySelector("[data-sub]");
  fetch(`data/${slugs[i]}.json`, {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => { const st = statusOf(d); dot.className = "dot "+st;
                 sub.textContent = st === "offline" ? "" : ago(d.updated); })
    .catch(() => { dot.className = "dot offline"; });
});
</script>
</body>
</html>
